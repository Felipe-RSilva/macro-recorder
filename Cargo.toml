[package]
name = "macro_recorder"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
enigo = "0.2.1"
image = { version = "0.25", default-features = false, features = ["png"] }
rdev = "0.5.3"
rfd = "0.15.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = "0.30"
